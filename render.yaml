services:
  # 1. Node.js Authentication Backend (MongoDB, Login, Register, Profile, Admin)
  - type: web
    name: mhtcet-auth-backend
    env: node
    plan: free
    rootDir: mhtcet/backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: SESSION_SECRET
        value: e98f7a23c4b109867d5e4f3a2b10984756291a83b2c1d0e9f8a7b6c5d4e3f2a1
      - key: ALLOWED_ORIGINS
        value: https://aimlrahulcounselling.netlify.app,http://localhost:5500,http://localhost:3000,http://localhost:5000

  # 2. Python FastAPI Predictor Backend (Cutoffs, AI Model, Predictions)
  - type: web
    name: mhtcet-predictor-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
